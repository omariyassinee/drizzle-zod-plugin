<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Doctor Registration</title>
		<style>
			:root {
				--font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				--bg: #f8fafc;
				--card-bg: #ffffff;
				--border: #e2e8f0;
				--text: #0f172a;
				--text-muted: #64748b;
				--primary: #2563eb;
				--primary-hover: #1d4ed8;
				--success-bg: #f0fdf4;
				--success-border: #bbf7d0;
				--success-text: #166534;
				--error-bg: #fef2f2;
				--error-border: #fecaca;
				--error-text: #991b1b;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: var(--font-sans);
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
			}

			.card {
				background: var(--card-bg);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 2rem;
				width: 100%;
				max-width: 440px;
				box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
			}

			h1 {
				font-size: 1.35rem;
				font-weight: 600;
				margin-bottom: 1.25rem;
			}

			.alert {
				padding: 0.75rem 1rem;
				border-radius: 8px;
				font-size: 0.875rem;
				margin-bottom: 1.25rem;
				border: 1px solid transparent;
			}

			.alert[hidden] {
				display: none;
			}

			.alert-success {
				background-color: var(--success-bg);
				border-color: var(--success-border);
				color: var(--success-text);
			}

			.alert-error {
				background-color: var(--error-bg);
				border-color: var(--error-border);
				color: var(--error-text);
			}

			.form-group {
				margin-bottom: 1rem;
			}

			label {
				display: block;
				font-size: 0.875rem;
				font-weight: 500;
				margin-bottom: 0.35rem;
				color: var(--text);
			}

			input {
				width: 100%;
				padding: 0.6rem 0.75rem;
				border: 1px solid var(--border);
				border-radius: 6px;
				font-size: 0.95rem;
				color: var(--text);
				background: #fff;
				transition: border-color 0.15s, box-shadow 0.15s;
			}

			input:focus {
				outline: none;
				border-color: var(--primary);
				box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
			}

			button[type="submit"] {
				width: 100%;
				padding: 0.65rem 1rem;
				background: var(--primary);
				color: #fff;
				border: none;
				border-radius: 6px;
				font-size: 0.95rem;
				font-weight: 500;
				cursor: pointer;
				transition: background 0.15s;
				margin-top: 0.5rem;
			}

			button[type="submit"]:hover {
				background: var(--primary-hover);
			}

			#errors {
				margin-top: 1rem;
				padding: 0.75rem;
				background: #f1f5f9;
				border-radius: 6px;
				font-size: 0.75rem;
				color: var(--error-text);
				overflow-x: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}

			#errors[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1>Doctor Registration</h1>
			<div id="alert" class="alert" role="alert" hidden></div>
			<form id="doctor-form" novalidate>
				<div class="form-group">
					<label for="email">Email</label>
					<input id="email" name="email" type="email" placeholder="ada@clinic.io" />
				</div>
				<div class="form-group">
					<label for="phone">Phone</label>
					<input id="phone" name="phone" type="tel" placeholder="+12125550100" />
				</div>
				<div class="form-group">
					<label for="age">Age</label>
					<input id="age" name="age" type="number" placeholder="34" />
				</div>
				<div class="form-group">
					<label for="licenseCode">License Code</label>
					<input id="licenseCode" name="licenseCode" placeholder="L1234567" />
				</div>
				<button type="submit">Register</button>
				<pre id="errors" hidden></pre>
			</form>
		</main>
		<script type="module" src="/src/client/main.ts"></script>
	</body>
</html>
